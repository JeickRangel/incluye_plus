<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="author" content="JeissonR" />
    <title>Sistema de Apoyos</title>

    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

    <!-- Estilos -->
    <link href="css/styles.css" rel="stylesheet" />
</head>

<body>
    <div class="d-flex" id="wrapper">

        <!-- Sidebar -->
        <div class="border-end bg-white" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom bg-light">Sistema de apoyos</div>
            <div class="list-group list-group-flush">
                <a class="list-group-item list-group-item-action p-3">1. Aprendizaje y conocimiento</a>
                <a class="list-group-item list-group-item-action p-3">2. Comunicación, lenguaje y pensamiento</a>
                <a class="list-group-item list-group-item-action p-3">3. Vida cotidiana</a>
                <a class="list-group-item list-group-item-action p-3">4. Participación social</a>
                <a class="list-group-item list-group-item-action p-3">5. Movilidad</a>
            </div>
        </div>

        <!-- Contenido -->
        <div id="page-content-wrapper">

            <!-- Navbar -->
            <nav class="navbar navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="sidebarToggle">Menu</button>
                </div>
            </nav>

            <!-- Contenido principal -->
            <div class="container-fluid py-4">

                <h1 class="mt-2">Sistema de apoyos</h1>
                <p class="text-muted">
                    Herramienta digital para facilitar el proceso de calificación del sistema de apoyos.
                </p>

                <!-- Datos -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3">

                            <div class="col-md-4">
                                <label class="form-label">Fecha</label>
                                <input type="date" id="fecha" class="form-control">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Nombre</label>
                                <input type="text" id="nombre" class="form-control">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Documento</label>
                                <input type="text" id="documento" class="form-control">
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Progreso -->
                <div class="card mb-4">
                    <div class="card-body">

                        <div class="d-flex justify-content-between">
                            <strong id="textoProgreso">Pregunta 1 de 25</strong>
                            <span id="categoriaActual" class="badge bg-primary">Categoría</span>
                        </div>

                        <div class="progress mt-2">
                            <div id="barraProgreso" class="progress-bar" style="width: 0%">0%</div>
                        </div>

                    </div>
                </div>

                <!-- Preguntas -->
                <div class="card">
                    <div class="card-body">

                        <div id="question-container"></div>

                        <div class="d-flex justify-content-between mt-4">
                            <button class="btn btn-outline-secondary" id="btnAnterior">Anterior</button>
                            <button class="btn btn-primary" id="btnSiguiente">Siguiente</button>
                        </div>

                    </div>
                </div>

                <!-- Resultado -->
                <div id="resultado-final" class="mt-4"></div>

                <!-- Botón PDF -->
                <div class="mt-3">
                    <button id="btnExportarPDF" class="btn btn-danger">
                        Exportar PDF
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->

    <!-- Librerías PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- scripts -->
    <script src="js/data.js"></script>
    <script src="js/scripts.js"></script>

</body>
</html>
