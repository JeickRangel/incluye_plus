<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incluye+ — Iniciar sesión</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link href="css/styles.css" rel="stylesheet" />
</head>

<body class="login-body">

    <div class="login-card">

        <div class="login-logo">
            <h1>Incluye<span>+</span></h1>
            <p>Sistema de gestión para servicios de discapacidad</p>
        </div>

        <div id="login-error" class="login-error" style="display:none"></div>

        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="login-email" class="form-control" placeholder="correo@ejemplo.com">
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="login-password" class="form-control" placeholder="Contraseña">
        </div>

        <button id="btn-login" class="btn btn-primary w-100">Ingresar</button>

    </div>

    <script>
        // Si ya hay sesión activa, ir directo al dashboard
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html'
        }

        document.getElementById('btn-login').addEventListener('click', async () => {
            const email    = document.getElementById('login-email').value.trim()
            const password = document.getElementById('login-password').value.trim()
            const errorDiv = document.getElementById('login-error')

            errorDiv.style.display = 'none'

            if (!email || !password) {
                errorDiv.textContent = 'Por favor completa todos los campos.'
                errorDiv.style.display = 'block'
                return
            }

            try {
                const res = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })

                const data = await res.json()

                if (!res.ok) {
                    errorDiv.textContent = data.error || 'Credenciales inválidas'
                    errorDiv.style.display = 'block'
                    return
                }

                // Guardar sesión en localStorage
                localStorage.setItem('token', data.token)
                localStorage.setItem('profesionalNombre', data.nombre)
                localStorage.setItem('profesionalDisciplina', data.disciplina)

                window.location.href = 'index.html'

            } catch (err) {
                errorDiv.textContent = 'No se pudo conectar con el servidor.'
                errorDiv.style.display = 'block'
            }
        })
    </script>

</body>
</html>
